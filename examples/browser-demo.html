<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge TTS - Complete Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        textarea, select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        select {
            cursor: pointer;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 10px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
        .status.show {
            display: block;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        audio {
            width: 100%;
            margin-top: 20px;
            display: none;
        }
        audio.show {
            display: block;
        }
        .voice-info {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Edge TTS Demo</h1>
        
        <div class="form-group">
            <label for="text">Text to speak:</label>
            <textarea id="text" placeholder="Enter text here...">Hello, this is a test of Edge Text-to-Speech in the browser.</textarea>
        </div>

        <div class="form-group">
            <label for="voiceSearch">🔍 Search voices:</label>
            <input type="text" id="voiceSearch" placeholder="Type to search (language, country, name...)">
        </div>

        <div class="form-group">
            <label for="voice">
                🗣️ Select voice: 
                <span class="voice-info" id="voiceInfo">Loading voices...</span>
            </label>
            <select id="voice" size="10" style="height: 200px;">
                <option>Loading voices...</option>
            </select>
        </div>

        <div class="form-group">
            <label>
                Pitch: <span id="pitchValue">+0Hz</span>
            </label>
            <input type="range" id="pitch" min="-50" max="50" value="0" step="5">
        </div>

        <div class="form-group">
            <label>
                Speed: <span id="rateValue">+0%</span>
            </label>
            <input type="range" id="rate" min="-50" max="100" value="0" step="10">
        </div>

        <div class="form-group">
            <label>
                Volume: <span id="volumeValue">+0%</span>
            </label>
            <input type="range" id="volume" min="-50" max="50" value="0" step="5">
        </div>

        <div>
            <button onclick="synthesize()" id="speakBtn">
                🔊 Speak
            </button>
            <button onclick="loadVoices()" id="refreshBtn">
                🔄 Refresh Voices
            </button>
        </div>

        <div class="status" id="status"></div>
        
        <audio id="player" controls class=""></audio>
    </div>

    <script src="../dist/browser/edge-tts.umd.js"></script>
    <script>
        const tts = new EdgeTTS.EdgeTTS();
        let allVoices = [];
        let audioUrl = null;

        // Update range values
        document.getElementById('pitch').oninput = (e) => {
            document.getElementById('pitchValue').textContent = (e.target.value >= 0 ? '+' : '') + e.target.value + 'Hz';
        };
        
        document.getElementById('rate').oninput = (e) => {
            document.getElementById('rateValue').textContent = (e.target.value >= 0 ? '+' : '') + e.target.value + '%';
        };
        
        document.getElementById('volume').oninput = (e) => {
            document.getElementById('volumeValue').textContent = (e.target.value >= 0 ? '+' : '') + e.target.value + '%';
        };

        // Search voices
        document.getElementById('voiceSearch').oninput = (e) => {
            const search = e.target.value.toLowerCase();
            const select = document.getElementById('voice');
            
            const filtered = allVoices.filter(v => 
                v.LocalName.toLowerCase().includes(search) ||
                v.Locale.toLowerCase().includes(search) ||
                v.Gender.toLowerCase().includes(search) ||
                v.ShortName.toLowerCase().includes(search)
            );

            select.innerHTML = '';
            filtered.forEach(voice => {
                const option = document.createElement('option');
                option.value = voice.ShortName;
                option.textContent = `${voice.LocalName} (${voice.Locale}) - ${voice.Gender}`;
                select.appendChild(option);
            });

            document.getElementById('voiceInfo').textContent = `${filtered.length} of ${allVoices.length} voices`;
        };

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status show ${type}`;
        }

        async function loadVoices() {
            const refreshBtn = document.getElementById('refreshBtn');
            const select = document.getElementById('voice');
            
            try {
                refreshBtn.disabled = true;
                refreshBtn.innerHTML = '<span class="loading"></span>Loading...';
                showStatus('Loading voices from Edge TTS API...', 'info');
                
                allVoices = await tts.getVoices();
                
                // Sort by locale then name
                allVoices.sort((a, b) => {
                    if (a.Locale !== b.Locale) return a.Locale.localeCompare(b.Locale);
                    return a.LocalName.localeCompare(b.LocalName);
                });

                select.innerHTML = '';
                allVoices.forEach((voice, index) => {
                    const option = document.createElement('option');
                    option.value = voice.ShortName;
                    option.textContent = `${voice.LocalName} (${voice.Locale}) - ${voice.Gender}`;
                    select.appendChild(option);
                    
                    // Select first English voice by default
                    if (voice.Locale.startsWith('en-US') && select.selectedIndex === -1) {
                        option.selected = true;
                    }
                });
                
                document.getElementById('voiceInfo').textContent = `${allVoices.length} voices available`;
                showStatus(`✅ Loaded ${allVoices.length} voices successfully!`, 'success');
                
                setTimeout(() => {
                    document.getElementById('status').classList.remove('show');
                }, 3000);
                
            } catch (error) {
                console.error('Error loading voices:', error);
                showStatus(`❌ Error loading voices: ${error.message}`, 'error');
                document.getElementById('voiceInfo').textContent = 'Error loading voices';
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.textContent = '🔄 Refresh Voices';
            }
        }

        async function synthesize() {
            const text = document.getElementById('text').value.trim();
            const voice = document.getElementById('voice').value;
            const pitch = parseInt(document.getElementById('pitch').value);
            const rate = parseInt(document.getElementById('rate').value);
            const volume = parseInt(document.getElementById('volume').value);
            
            if (!text) {
                showStatus('⚠️ Please enter some text', 'error');
                return;
            }
            
            if (!voice) {
                showStatus('⚠️ Please select a voice', 'error');
                return;
            }

            const speakBtn = document.getElementById('speakBtn');
            const player = document.getElementById('player');
            
            if (audioUrl) URL.revokeObjectURL(audioUrl);
            player.classList.remove('show');

            try {
                speakBtn.disabled = true;
                speakBtn.innerHTML = '<span class="loading"></span>Synthesizing...';
                showStatus('🎙️ Generating speech...', 'info');
                
                await tts.synthesize(text, voice, {
                    pitch: pitch,
                    rate: rate,
                    volume: volume
                });
                
                showStatus('🎵 Processing audio...', 'info');
                
                const audioData = tts.getAudioData();
                const blob = new Blob([audioData], { type: 'audio/mpeg' });
                audioUrl = URL.createObjectURL(blob);
                
                player.src = audioUrl;
                player.classList.add('show');
                
                const sizeKB = (blob.size / 1024).toFixed(2);
                showStatus(`✅ Audio generated successfully! (${sizeKB} KB)`, 'success');
                
                setTimeout(() => player.play(), 100);
                
            } catch (error) {
                console.error('Synthesis error:', error);
                showStatus(`❌ Error: ${error.message}`, 'error');
            } finally {
                speakBtn.disabled = false;
                speakBtn.textContent = '🔊 Speak';
            }
        }

        // Load voices on startup
        loadVoices();

        // Allow Ctrl+Enter to synthesize
        document.getElementById('text').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                synthesize();
            }
        });
    </script>
</body>
</html>
